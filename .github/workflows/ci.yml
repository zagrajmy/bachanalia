name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_BASE_URL: http://localhost:3100
  # The apex is this app since the cutover; WordPress answers on wp.
  NEXT_PUBLIC_WORDPRESS_API_URL: https://wp.bachanaliafantastyczne.pl
  NEXT_PUBLIC_WORDPRESS_API_HOSTNAME: wp.bachanaliafantastyczne.pl

jobs:
  static:
    name: lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Generate types from the committed schema
        run: bun run codegen

      - uses: jdx/mise-action@v4

      # Before the lint step: `next-env.d.ts` is generated and gitignored, and
      # without it every image import is an unresolved type, which the
      # type-aware rules report as an unsafe `error` value.
      - name: Generate Next types
        run: bunx next typegen

      - name: Lint and format check
        run: |
          mise use -g hk@1.48.0
          hk check --all

      - name: Types
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium --with-deps

      - name: Install system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Cache Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            next-${{ runner.os }}-

      - name: Build
        run: bun run build

      - name: Run e2e
        run: bun run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
