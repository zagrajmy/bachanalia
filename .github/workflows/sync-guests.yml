name: sync-guests

on:
  schedule:
    - cron: "23 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ssh-key: ${{ secrets.SYNC_GUESTS_DEPLOY_KEY }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run codegen
      - run: bun scripts/sync-guests.ts
      - run: bunx next typegen && bun run typecheck
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/guests.generated.ts src/content/guests
          git diff --cached --quiet || { git commit -m "Sync guests from the sheet" && git push; }
